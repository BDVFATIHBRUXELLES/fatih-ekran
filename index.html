/* ---- Renk temaları ---- */
/* Açık mavi: logonun kubbe mavisi geniş yüzeylerde, lacivert yalnızca yazıda */
:root{
  --zemin:#FBFCFE; --yazi:#1B1D52; --buyuk:#1F78D1;
  --bant:#45ADEA; --bant-yazi:#FFFFFF; --bant-ad:#FFFFFF;
  --alt-zemin:#000000; --alt-yazi:#FFFFFF; --alt-site:#8CD0F0;
  --secili:#F5B93F; --secili-yazi:#1B1D52;
  --kutu:#E4F3FB;
  --namaz-zemin:#E4F3FB; --namaz-yazi:#1B1D52; --namaz-ikincil:#1F78D1; --namaz-vurgu:#1F78D1; --namaz-cizgi:rgba(27,29,82,.22);
  --yedek:#1F78D1; --yedek-yazi:#FFFFFF; --yedek-ikincil:#D6ECFA;
}
body[data-tema="canli"]{
  --bant:#1F78D1; --bant-yazi:#FFFFFF; --bant-ad:#D6ECFA;
  --kutu:#DDEFF9;
  --namaz-zemin:#1F78D1; --namaz-yazi:#FFFFFF; --namaz-ikincil:#D6ECFA; --namaz-vurgu:#FFD479; --namaz-cizgi:rgba(255,255,255,.4);
}
body[data-tema="zumrut"]{
  --zemin:#FAF9F5; --yazi:#0E4A3C; --buyuk:#176B57;
  --bant:#176B57; --bant-yazi:#FAF9F5; --bant-ad:#DCEDE4;
  --secili:#D9AE62; --secili-yazi:#0E4A3C;
  --kutu:#DCEDE4;
  --namaz-zemin:#0E4A3C; --namaz-yazi:#FAF9F5; --namaz-ikincil:#DCEDE4; --namaz-vurgu:#D9AE62; --namaz-cizgi:rgba(255,255,255,.3);
  --yedek:#176B57; --yedek-yazi:#FAF9F5; --yedek-ikincil:#DCEDE4;
}

/* ---- Yazı karakterleri ---- */
/* Modern: Montserrat, güçlü ve temiz */
:root{
  --baslik:"Montserrat","Segoe UI",Roboto,Arial,sans-serif;
  --sans:"Montserrat","Segoe UI",Roboto,Arial,sans-serif;
  --kalin:800; --harf:-.02em;
  --b-ad:52px; --b-saat:68px; --b-gun:230px; --b-sure:104px; --b-vakit:60px; --b-namaz:160px; --b-yedek:62px;
}
body[data-yazi="zarif"]{
  --baslik:"Playfair Display",Georgia,"Times New Roman",serif;
  --kalin:800; --harf:-.01em;
  --b-ad:56px; --b-saat:74px; --b-gun:250px; --b-sure:112px; --b-vakit:60px; --b-namaz:180px; --b-yedek:74px;
}
body[data-yazi="yumusak"]{
  --baslik:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Bricolage","Segoe UI",Roboto,Arial,sans-serif;
  --kalin:750; --harf:-.02em;
  --b-ad:54px; --b-saat:76px; --b-gun:256px; --b-sure:116px; --b-vakit:60px; --b-namaz:184px; --b-yedek:76px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;left:0;top:0;background:#EEF2F6;font-family:var(--sans);color:var(--yazi)}

body.tv{background:var(--zemin)}
#boyut-bilgi{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);display:none;z-index:50;padding:14px 26px;border-radius:999px;background:#1B1D52;color:#FFFFFF;font-family:"Montserrat","Segoe UI",Arial,sans-serif;font-size:22px;font-size:min(22px,2.4vw);font-weight:650;line-height:1.25;text-align:center;max-width:92vw}

/* 1920x1080 sahne; her ekrana oranı bozulmadan sığdırılır */
#sahne{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--zemin)}

/* Sabit genişlikli rakamlar: saniye değişirken yazı oynamaz */
.rakam{font-family:var(--baslik);font-feature-settings:"lnum" 1,"tnum" 1;white-space:nowrap;display:inline-block}
.rakam .d{display:inline-block;width:var(--dw,.6em);text-align:center}
.rakam .c{display:inline-block;width:var(--cw,.3em);text-align:center}
.rakam.oransal{font-feature-settings:"lnum" 1,"pnum" 1}

/* Sol: dikey video alanı */
#video-alani{position:absolute;left:0;top:0;width:608px;height:1080px;background:var(--yedek);overflow:hidden}
#video-alani video,#video-alani img.icerik{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:none;background:var(--yedek)}
#video-alani iframe.icerik{position:absolute;left:0;top:0;width:100%;height:100%;border:0;display:none;background:var(--yedek)}
#video-alani .yatay{object-fit:contain}
#video-yedek{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:72px 56px;background:var(--yedek);color:var(--yedek-yazi)}
#video-yedek img{width:300px;height:auto;margin-bottom:48px;display:none}
#video-yedek .ad{font-family:var(--baslik);font-weight:var(--kalin);font-size:var(--b-yedek);line-height:1.08;letter-spacing:var(--harf)}
#video-yedek .site{margin-top:28px;font-size:36px;font-weight:600;color:var(--yedek-ikincil)}

/* Kampanya kartı: kalan gün her gün hesaplanır; oran ve tutarlar bxlfatih.com'dan otomatik gelir */
#kampanya{position:absolute;left:0;top:0;width:100%;height:100%;display:none;flex-direction:column;padding:70px 56px 60px;background:var(--yedek);color:#FFFFFF}
#kampanya .k-ust{font-size:32px;font-weight:650;color:var(--yedek-ikincil)}
#kampanya .k-baslik{margin-top:8px;font-family:var(--baslik);font-weight:var(--kalin);font-size:88px;line-height:1;letter-spacing:var(--harf)}
#kampanya .k-sayac{margin-top:auto}
#kampanya .k-gun{font-family:var(--baslik);font-weight:var(--kalin);font-size:250px;line-height:.82;letter-spacing:-.04em;font-feature-settings:"lnum" 1}
#kampanya .k-gun-yazi{margin-top:16px;font-family:var(--baslik);font-weight:var(--kalin);font-size:62px;line-height:1}
#kampanya .k-son{margin-top:12px;font-size:28px;font-weight:600;color:var(--yedek-ikincil)}
#kampanya .k-cubuk{margin-top:44px;height:28px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden}
#kampanya .k-dolu{height:100%;border-radius:999px;background:#F5B93F;width:0}
#kampanya .k-oran{margin-top:18px;font-size:38px;font-weight:750}
#kampanya .k-tutar{margin-top:10px;font-size:27px;font-weight:600;line-height:1.3;white-space:pre-line}
#kampanya .k-tarih{margin-top:6px;font-size:23px;font-weight:500;color:var(--yedek-ikincil)}
#kampanya .k-alt{margin-top:auto;display:flex;align-items:center}
#kampanya .k-alt img{width:150px;height:150px;border-radius:14px;background:#FFFFFF;display:none}
#kampanya .k-alt-yazi{margin-left:24px}
#kampanya .k-cagri{font-family:var(--baslik);font-weight:var(--kalin);font-size:34px;line-height:1.1}
#kampanya .k-adres{margin-top:8px;font-size:23px;font-weight:600;color:var(--yedek-ikincil)}

/* Web sitesi kartı */
#site-kart{position:absolute;left:0;top:0;width:100%;height:100%;display:none;flex-direction:column;padding:76px 56px 64px;background:#FFFFFF;color:var(--yazi)}
#site-kart .s-logo{width:150px;height:auto;display:none}
#site-kart .s-ust{margin-top:34px;font-size:32px;font-weight:650;color:var(--buyuk)}
#site-kart .s-adres{margin-top:6px;font-family:var(--baslik);font-weight:var(--kalin);font-size:74px;line-height:1.02;letter-spacing:var(--harf)}
#site-kart .s-metin{margin-top:22px;font-size:28px;font-weight:550;line-height:1.3}
#site-kart .s-alt{margin-top:auto}
#site-kart .s-qr{width:300px;height:300px;display:none}
#site-kart .s-qr-yazi{margin-top:14px;font-size:27px;font-weight:650;color:var(--buyuk)}
#site-kart .s-sosyal{margin-top:44px;font-size:25px;font-weight:600;line-height:1.5}
#site-kart .s-sosyal b{font-weight:800}

/* Günün ayeti ve hadisi (kaynak: Diyanet İşleri Başkanlığı) */
#soz-kart{position:absolute;left:0;top:0;width:100%;height:100%;display:none;flex-direction:column;padding:70px 56px 60px;background:#FFFFFF;color:var(--yazi);--z-kat:.72}
#soz-kart .z-etiket{font-family:var(--baslik);font-weight:var(--kalin);font-size:calc(58px * var(--z-kat));line-height:1;color:var(--buyuk)}
#soz-kart .z-cizgi{margin-top:calc(26px * var(--z-kat));width:calc(120px * var(--z-kat));height:8px;border-radius:999px;background:#F5B93F}
#soz-kart .z-metin{margin-top:auto;font-size:calc(var(--z-boyut,46px) * var(--z-kat));font-weight:650;line-height:1.32}
#soz-kart .z-kaynak{margin-top:calc(30px * var(--z-kat));font-size:calc(36px * var(--z-kat));font-weight:750;color:var(--buyuk)}
#soz-kart .z-alt{margin-top:auto;font-size:calc(26px * var(--z-kat));font-weight:600;opacity:.7}

/* Bilgi kartı: bir kurumu ya da hizmeti maddelerle tanıtır (metinler veri/ayarlar.js içinde) */
#bilgi-kart{position:absolute;left:0;top:0;width:100%;height:100%;display:none;flex-direction:column;padding:64px 56px 56px;background:var(--yedek);color:#FFFFFF;--b-kat:.66}
#bilgi-kart .b-logo{width:calc(120px * var(--b-kat));height:auto;display:none}
#bilgi-kart .b-ust{margin-top:calc(28px * var(--b-kat));font-size:calc(36px * var(--b-kat));font-weight:650;color:var(--yedek-ikincil)}
#bilgi-kart .b-baslik{margin-top:6px;font-family:var(--baslik);font-weight:var(--kalin);font-size:calc(76px * var(--b-kat));line-height:1.04;letter-spacing:var(--harf);text-wrap:balance}
#bilgi-kart .b-liste{margin-top:auto;list-style:none}
#bilgi-kart .b-liste li{padding:calc(13px * var(--b-kat)) 0;border-top:2px solid rgba(255,255,255,.28);font-size:calc(35px * var(--b-kat));font-weight:650;line-height:1.2}
#bilgi-kart .b-liste li:last-child{border-bottom:2px solid rgba(255,255,255,.28)}
#bilgi-kart .b-alt{margin-top:auto;display:flex;align-items:center}
#bilgi-kart .b-alt img{width:calc(160px * var(--b-kat));height:calc(160px * var(--b-kat));border-radius:14px;background:#FFFFFF;display:none;flex:none}
#bilgi-kart .b-alt-yazi{margin-left:calc(30px * var(--b-kat))}
#bilgi-kart .b-adres{font-family:var(--baslik);font-weight:var(--kalin);font-size:calc(48px * var(--b-kat));line-height:1.1}
#bilgi-kart .b-not{margin-top:8px;font-size:calc(29px * var(--b-kat));font-weight:600;line-height:1.3;color:var(--yedek-ikincil);white-space:pre-line}

/* Pano: başlıklı görsel */
#pano{position:absolute;left:0;top:0;width:100%;height:100%;display:none;flex-direction:column;padding:76px 44px 64px;background:var(--yedek);color:#FFFFFF}
#pano .p-baslik{text-wrap:balance;padding:0 12px;font-family:var(--baslik);font-weight:var(--kalin);font-size:54px;line-height:1.05;letter-spacing:var(--harf)}
#pano img{margin-top:auto;width:100%;height:auto;border-radius:22px;display:block}
#pano .p-aciklama{margin-top:auto;padding:0 12px;font-size:32px;font-weight:650;line-height:1.3}

/* Sağ: bilgi paneli */
#panel{position:absolute;left:608px;top:0;width:1312px;height:1080px}

#ust{position:absolute;left:0;top:0;width:100%;height:156px;padding:0 64px 0 52px;display:flex;align-items:center;justify-content:space-between}
#kimlik{display:flex;align-items:center}
#logo{height:124px;width:auto;margin-right:24px;display:none}
#cami-adi{font-family:var(--baslik);font-weight:var(--kalin);font-size:var(--b-ad);letter-spacing:var(--harf);color:var(--yazi);white-space:nowrap}
#saat{font-size:var(--b-saat);font-weight:700;color:var(--yazi)}

#orta{position:absolute;left:0;top:156px;width:100%;height:434px}
#takvim{position:absolute;left:64px;top:0;height:100%;display:flex;align-items:center}
#gun-sayi{font-family:var(--baslik);font-weight:var(--kalin);font-size:var(--b-gun);line-height:.8;letter-spacing:-.04em;color:var(--buyuk);font-feature-settings:"lnum" 1}
#takvim-yazi{margin-left:30px}
#ay-yil{font-size:42px;font-weight:750;line-height:1.15;color:var(--yazi)}
#gun-adi{font-size:42px;font-weight:500;line-height:1.15;color:var(--buyuk)}
#hicri{margin-top:8px;font-size:28px;font-weight:650;line-height:1.15;color:var(--yazi);opacity:.75}

#kalan{position:absolute;right:0;top:20px;width:624px;height:374px;padding:54px 0 0 52px;background:var(--kutu);border-radius:36px 0 0 36px}
#kalan-etiket{font-size:38px;font-weight:700;line-height:1.1;color:var(--yazi)}
#kalan-sure{margin-top:36px;font-size:var(--b-sure);font-weight:var(--kalin);line-height:1;letter-spacing:-.02em;color:var(--buyuk)}
#kalan-not{margin-top:22px;font-size:34px;line-height:1.25;color:var(--yazi);max-width:520px;display:none}

/* Vakit şeridi */
#vakitler{position:absolute;left:0;top:590px;width:100%;height:330px;padding:44px 20px;background:var(--bant);display:flex}
.vakit{flex:1 1 0;margin:0 4px;padding:34px 0 0;border-radius:26px;text-align:center;color:var(--bant-yazi)}
.vakit .ad{font-size:36px;font-weight:650;color:var(--bant-ad)}
.vakit .zaman{margin-top:32px;font-size:var(--b-vakit);font-weight:var(--kalin);line-height:1}
.vakit.gecti{opacity:.72}
.vakit.cemaat{display:none}
.vakit.siradaki{background:var(--secili);color:var(--secili-yazi)}
.vakit.siradaki .ad{color:var(--secili-yazi);font-weight:800}

/* Duyuru bandı */
#alt{position:absolute;left:0;top:920px;width:100%;height:160px;padding:0 64px;display:flex;align-items:center;justify-content:space-between;background:var(--alt-zemin)}
#duyuru{font-size:36px;font-weight:650;line-height:1.25;color:var(--alt-yazi);max-width:990px;transition:opacity .6s ease}
#site{font-size:34px;font-weight:750;color:var(--alt-site);white-space:nowrap;margin-left:40px}

/* Hangi sürümün yüklü olduğunu uzaktan anlamak için köşede küçük etiket */
/* Kampanya kartının tam ekran hâli: sırası gelince bütün ekranı kaplar, saat ve geri sayım köşede kalır */
@keyframes belir{from{opacity:0}to{opacity:1}}
#kampanya-tam{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;flex-direction:column;padding:56px 96px 56px;background:var(--yedek);color:#FFFFFF;animation:belir .6s ease}
#kampanya-tam .kt-ust{display:flex;justify-content:space-between;align-items:flex-start}
#kampanya-tam .kt-slogan{font-size:42px;font-weight:650;color:var(--yedek-ikincil)}
#kampanya-tam .kt-baslik{margin-top:6px;font-family:var(--baslik);font-weight:var(--kalin);font-size:128px;line-height:1;letter-spacing:var(--harf)}
#kampanya-tam .kt-zaman{text-align:right;flex:none}
#kampanya-tam .kt-saat{font-size:92px;font-weight:700;line-height:1}
#kampanya-tam .kt-kalan{margin-top:12px;font-size:30px;font-weight:600;color:var(--yedek-ikincil);white-space:nowrap}
#kampanya-tam .kt-kalan .rakam{font-weight:700;color:#FFFFFF;margin-left:8px}
#kampanya-tam .kt-orta{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
#kampanya-tam .kt-yuzde{display:flex;align-items:baseline;white-space:nowrap}
#kampanya-tam .kt-yuzde-sayi{font-family:var(--baslik);font-weight:var(--kalin);font-size:360px;line-height:.8;letter-spacing:-.04em;font-feature-settings:"lnum" 1}
#kampanya-tam .kt-yuzde.uc .kt-yuzde-sayi{font-size:290px}
#kampanya-tam .kt-yuzde-yazi{margin-left:34px;font-family:var(--baslik);font-weight:var(--kalin);font-size:84px;line-height:1}
#kampanya-tam .kt-gun{text-align:right;flex:none;white-space:nowrap}
#kampanya-tam .kt-gun-sayi{font-family:var(--baslik);font-weight:var(--kalin);font-size:200px;line-height:.8;letter-spacing:-.04em;padding-right:.04em;font-feature-settings:"lnum" 1}
#kampanya-tam .kt-yuzde.uc .kt-yuzde-yazi{font-size:68px}
#kampanya-tam .kt-gun.son .kt-gun-yazi{font-size:46px}
#kampanya-tam .kt-gun-yazi{margin-top:18px;font-family:var(--baslik);font-weight:var(--kalin);font-size:62px;line-height:1}
#kampanya-tam .kt-son{margin-top:10px;font-size:30px;font-weight:600;color:var(--yedek-ikincil)}

      gorselSayaci = setTimeout(sonraki, (aktif.sure || 20) * 1000);
    } else if (aktif.tip === "bilgi") {
      try { vid.pause(); } catch (e) {}
      if (!bilgiCiz(aktif.kart)) { gorselSayaci = setTimeout(sonraki, 500); return; }
      hataSayisi = 0;
      panelGoster("bilgi");
      gorselSayaci = setTimeout(sonraki, (aktif.sure || 18) * 1000);
    } else if (aktif.tip === "site") {
      try { vid.pause(); } catch (e) {}
      siteCiz();
      hataSayisi = 0;
      panelGoster("site");
      gorselSayaci = setTimeout(sonraki, (aktif.sure || 12) * 1000);
    } else if (aktif.tip === "pano") {
      try { vid.pause(); } catch (e) {}
      el("p-baslik").textContent = aktif.baslik || "";
      el("p-aciklama").textContent = aktif.aciklama || "";
      var pg = el("p-gorsel");
      pg.onload = function () { hataSayisi = 0; panelGoster("pano"); };
      pg.onerror = hata;
      if (pg.getAttribute("src") === aktif.dosya && pg.complete && pg.naturalWidth) { hataSayisi = 0; panelGoster("pano"); }
      else pg.src = aktif.dosya;
      gorselSayaci = setTimeout(sonraki, (aktif.sure || 12) * 1000);
    } else if (aktif.tip === "sayfa") {
      /* Canlı sayfa (ör. bağış havuzu): bir kez yüklenir, sırası gelince gösterilir; sayfa kendi verisini kendisi yeniler */
      try { vid.pause(); } catch (e) {}
      var sf = el("sayfa");
      if (sf.getAttribute("src") !== aktif.dosya) sf.src = aktif.dosya;
      hataSayisi = 0;
      panelGoster("sayfa");
      gorselSayaci = setTimeout(sonraki, (aktif.sure || 20) * 1000);
    } else if (aktif.tip === "gorsel") {
      try { vid.pause(); } catch (e) {}
      gorsel.onload = function () { hataSayisi = 0; panelGoster("gorsel"); };
      gorsel.onerror = hata;
      gorsel.src = aktif.dosya;
      gorselSayaci = setTimeout(sonraki, (aktif.sure || 12) * 1000);
    } else {
      vid.muted = !ekranAyar().sesli;
      vid.src = aktif.dosya;
      vid.load();
      if (!namazAcik) { var p = vid.play(); if (p && p.catch) p.catch(function () {}); }
    }
  }
  function hata() {
    hataSayisi++;
    var n = gecerliListe().length;
    if (hataSayisi >= n) { yedegiGoster(); clearTimeout(gorselSayaci); gorselSayaci = setTimeout(function () { hataSayisi = 0; sonraki(); }, 30000); }
    else { clearTimeout(gorselSayaci); gorselSayaci = setTimeout(sonraki, 1000); }
  }
  vid.addEventListener("playing", function () {
    hataSayisi = 0;
    vid.className = vid.videoWidth > vid.videoHeight ? "yatay" : "";
    panelGoster("video");
  });
  vid.addEventListener("ended", sonraki);
  vid.addEventListener("error", hata);

  /* ---------- Duyurular ---------- */
  var duyuruSira = 0;
  function duyuruGoster() {
    var D = A.duyurular || [], kutu = el("duyuru");
    if (!D.length) { kutu.textContent = ""; return; }
    /* Duyuru düz yazı ya da { metin, bas, bit, ekran } olabilir; tarihi geçen ya da bu ekrana ait olmayan atlanır */
    var metin = null, deneme = 0, bugun = gunAnahtari(simdi());
    while (metin === null && deneme < D.length) {
      var d = D[duyuruSira % D.length];
      duyuruSira++; deneme++;
      if (d && typeof d === "object") {
        if (!d.metin) continue;
        if (d.bas && bugun < d.bas) continue;
        if (d.bit && bugun > d.bit) continue;
        if (d.ekran && d.ekran.indexOf(ekran) === -1) continue;
        metin = metinDoldur(String(d.metin));
      } else if (d) metin = metinDoldur(String(d));
    }
    if (metin === null) { kutu.textContent = ""; return; }
    kutu.style.opacity = 0;
    setTimeout(function () { kutu.textContent = metin; kutu.style.opacity = 1; }, 650);
  }

  /* ---------- Veriyi yenile: liste 5 dakikada, vakitler saatte bir ---------- */
  function yenidenYukle(dosya) {
    var s = document.createElement("script");
    s.src = dosya + "?t=" + Date.now();
    s.onload = s.onerror = function () { if (s.parentNode) s.parentNode.removeChild(s); sonCizim = ""; };
    document.head.appendChild(s);
  }
  setInterval(function () { yenidenYukle("veri/playlist.js"); }, 2 * 60000);
  setInterval(function () { yenidenYukle("veri/vakitler.js"); }, 60 * 60000);
  setInterval(function () { yenidenYukle("veri/kampanya.js"); }, 10 * 60000);
  setInterval(function () { yenidenYukle("veri/gunun-sozu.js"); }, 15 * 60000);

  /* ---------- Kendiliğinden güncelleme ----------
     Ekran, veri/surum.js dosyasına iki dakikada bir bakar. Oradaki sürüm bu sayfanınkinden
     farklıysa sayfayı yeni adresle baştan yükler; böylece tarayıcının eski kopyası kullanılmaz.
     Sayfa her değiştiğinde SURUM ve veri/surum.js birlikte artırılır. */
  var SURUM = "20";
  el("surum-etiket").textContent = "sürüm " + SURUM;
  function surumDenetle() {
    var s = document.createElement("script");
    s.src = "veri/surum.js?t=" + Date.now();
    s.onerror = function () { if (s.parentNode) s.parentNode.removeChild(s); };
    s.onload = function () {
      if (s.parentNode) s.parentNode.removeChild(s);
      var yeni = window.FATIH_SURUM ? String(window.FATIH_SURUM) : "";
      if (!yeni || yeni === SURUM) return;
      if (param("s") === yeni) return; /* bu adres zaten denendi: döngüye girme */
      var q = (location.search || "").replace(/^\?/, "").split("&"), yeniQ = [], i;
      for (i = 0; i < q.length; i++) if (q[i] && q[i].indexOf("s=") !== 0 && q[i].indexOf("simdi=") !== 0) yeniQ.push(q[i]);
      yeniQ.push("s=" + encodeURIComponent(yeni));
      location.replace(location.pathname + "?" + yeniQ.join("&") + (location.hash || ""));
    };
    document.head.appendChild(s);
  }
  if (location.protocol !== "file:") { setTimeout(surumDenetle, 15000); setInterval(surumDenetle, 2 * 60000); }

  /* ---------- Sahneyi ekrana sığdır ---------- */
  var sahne = el("sahne"), cubuk = el("onizleme");
  /* Görüntü boyutu (yüzde). Televizyon kenarları kırpıyorsa kumandanın yukarı/aşağı tuşlarıyla
     küçültülür; ayar o televizyonda saklanır. Adrese ?boyut=92 yazarak da verilebilir. */
  var boyut = 100;
  (function () {
    var b = parseInt(param("boyut"), 10);
    if (!(b >= 60 && b <= 100)) { try { b = parseInt(localStorage.getItem("fatih-boyut"), 10); } catch (e) { b = NaN; } }
    if (!(b >= 60 && b <= 100)) b = parseInt(A.boyut, 10);
    if (b >= 60 && b <= 100) boyut = b;
  })();
  function gorunenAlan() {
    var vv = window.visualViewport, de = document.documentElement;
    var w = (vv && vv.width) || de.clientWidth || window.innerWidth;
    var h = (vv && vv.height) || de.clientHeight || window.innerHeight;
    return [w, h];
  }
  var sonAlan = "";
  function sigdir() {
    var a = gorunenAlan(), pay = tvModu ? 0 : 64, w = a[0], h = a[1] - pay;
    if (!(w > 0 && h > 0)) return;
    var o = Math.min(w / 1920, h / 1080) * (tvModu ? boyut / 100 : 1);
    sonAlan = w + "x" + h + "x" + boyut + "x" + tvModu;
    sahne.style.transform = "scale(" + o + ")";
    sahne.style.left = Math.round((w - 1920 * o) / 2) + "px";
    sahne.style.top = Math.round((h - 1080 * o) / 2) + "px";
    document.body.className = tvModu ? "tv" : "";
  }
  window.addEventListener("resize", sigdir);
  window.addEventListener("orientationchange", sigdir);
  if (window.visualViewport) { try { window.visualViewport.addEventListener("resize", sigdir); } catch (e) {} }
  /* Bazı televizyon tarayıcıları boyutu geç bildirir: değiştiyse yeniden sığdır */
  setInterval(function () {
    var a = gorunenAlan();
    if (a[0] + "x" + (a[1] - (tvModu ? 0 : 64)) + "x" + boyut + "x" + tvModu !== sonAlan) sigdir();
  }, 2000);

  var boyutKutu = el("boyut-bilgi"), boyutSayac = null;
  function boyutAyarla(yeni) {
    boyut = Math.max(60, Math.min(100, yeni));
    try { localStorage.setItem("fatih-boyut", String(boyut)); } catch (e) {}
    sigdir();
    boyutKutu.textContent = "Görüntü boyutu %" + boyut + " — kumandada yukarı: büyüt, aşağı: küçült";
    boyutKutu.style.display = "block";
    clearTimeout(boyutSayac);
    boyutSayac = setTimeout(function () { boyutKutu.style.display = "none"; }, 4000);
  }
  /* Tam ekran: tarayıcının adres çubuğunu gizler. Tarayıcılar bunu yalnızca bir tuşa ya da
     tıklamaya karşılık yapar; bu yüzden kumandanın OK tuşuna bağlı. */
  function tamEkranMi() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function tamEkranIste() {
    var k = document.documentElement, f = k.requestFullscreen || k.webkitRequestFullscreen;
    if (!f || tamEkranMi()) return;
    try { var s = f.call(k); if (s && s.catch) s.catch(function () {}); } catch (e) {}
  }
  function ipucuGoster() {
    /* Pencere ekrandan belirgin biçimde kısaysa tarayıcı çubuğu görünüyordur */
    if (!tvModu || tamEkranMi()) return;
    var a = gorunenAlan(), eksik = (window.screen && screen.height) ? screen.height - a[1] : 0;
    if (eksik < 30) return;
    boyutKutu.textContent = "Adres çubuğunu gizlemek için kumandada OK tuşuna basın";
    boyutKutu.style.display = "block";
    clearTimeout(boyutSayac);
    boyutSayac = setTimeout(function () { boyutKutu.style.display = "none"; }, 12000);
  }
  setTimeout(ipucuGoster, 1500);
  document.addEventListener("click", function () { if (tvModu) tamEkranIste(); });
  document.addEventListener("fullscreenchange", function () { boyutKutu.style.display = "none"; sigdir(); });
  document.addEventListener("webkitfullscreenchange", function () { boyutKutu.style.display = "none"; sigdir(); });

  document.addEventListener("keydown", function (o) {
    if (!tvModu) return;
    var k = o.key || "", kod = o.keyCode || 0;
    if (k === "Enter" || kod === 13 || kod === 23) { tamEkranIste(); return; }
    if (k === "ArrowDown" || kod === 40 || k === "-") { boyutAyarla(boyut - 1); if (o.preventDefault) o.preventDefault(); }
    else if (k === "ArrowUp" || kod === 38 || k === "+" || k === "=") { boyutAyarla(boyut + 1); if (o.preventDefault) o.preventDefault(); }
  });

  /* ---------- Ön izleme çubuğu ---------- */
  function cubuguGuncelle(simAd) {
    var b = cubuk.getElementsByTagName("button"), i;
    for (i = 0; i < b.length; i++) {
      var e = b[i].getAttribute("data-ekran"), s = b[i].getAttribute("data-sim"), tm = b[i].getAttribute("data-tema"), yz = b[i].getAttribute("data-yazi");
      if (yz) b[i].setAttribute("aria-pressed", yz === yazi ? "true" : "false");
      if (e) b[i].setAttribute("aria-pressed", e === ekran ? "true" : "false");
      if (tm) b[i].setAttribute("aria-pressed", tm === tema ? "true" : "false");
      if (s && simAd) b[i].setAttribute("aria-pressed", s === simAd ? "true" : "false");
    }
  }
  if (!tvModu) {
    cubuk.style.display = "flex";
    cubuk.addEventListener("click", function (olay) {
      var t = olay.target;
      if (!t || t.tagName !== "BUTTON") return;
      var e = t.getAttribute("data-ekran"), s = t.getAttribute("data-sim"), tm = t.getAttribute("data-tema"), yz = t.getAttribute("data-yazi");
      if (yz) { yazi = yz; temaUygula(); cubuguGuncelle(null); }
      if (e) { ekran = e; sonSaniye = -1; sonCizim = ""; cubuguGuncelle(null); }
      if (tm) { tema = tm; temaUygula(); cubuguGuncelle(null); }
      if (s) {
        var bugun = gunAnahtari(gercekDuvar()), v = gununVakitleri(bugun);
        if (s === "gercek" || !v) simAyarla(null);
        else if (s === "ogle") simAyarla(vakitMs(bugun, v[2]) - 20000);
        else if (s === "gece") simAyarla(vakitMs(bugun, v[5]) + 45 * 60000);
        cubuguGuncelle(s);
      }
      tik();
    });
    cubuguGuncelle(simFark ? null : "gercek");

    /* Tam ekran: çubuk gizlenir, televizyondaki görüntünün aynısı olur. Esc ile geri dönülür. */
    var tamEkranda = false;
    function tamEkranAyarla(acik) {
      tamEkranda = acik; tvModu = acik;
      cubuk.style.display = acik ? "none" : "flex";
      sigdir();
    }
    el("tam-ekran").addEventListener("click", function () {
      tamEkranAyarla(true);
      var k = document.documentElement, f = k.requestFullscreen || k.webkitRequestFullscreen;
      if (f) { try { var s = f.call(k); if (s && s.catch) s.catch(function () {}); } catch (e) {} }
    });
    function tamEkrandanCik() { if (tamEkranda && !(document.fullscreenElement || document.webkitFullscreenElement)) tamEkranAyarla(false); }
    document.addEventListener("fullscreenchange", tamEkrandanCik);
    document.addEventListener("webkitfullscreenchange", tamEkrandanCik);
    document.addEventListener("keydown", function (o) { if (o.key === "Escape" && tamEkranda) tamEkranAyarla(false); });
  }

  /* ---------- Başlat ---------- */
  sigdir();
  tik();
  setInterval(tik, 200);
  duyuruGoster();
  setInterval(duyuruGoster, (A.duyuruSuresi || 12) * 1000);
  sonraki();
})();
</script>
</body>
</html>
