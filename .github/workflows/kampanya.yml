name: Kampanya oranını siteden güncelle

# bxlfatih.com ana sayfasındaki "%.. tamamlandı" bilgisini saatte bir okur.
# Değer değiştiyse veri/kampanya.js dosyasını günceller; ekranlar kendiliğinden yenisini gösterir.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: kampanya
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Siteden oku
        run: node araclar/kampanya-guncelle.mjs

      - name: Değiştiyse kaydet
        id: kaydet
        run: |
          if git diff --quiet -- veri/kampanya.js; then
            echo "Değişiklik yok"
            exit 0
          fi
          git config user.name "fatih-ekran-otomatik"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/kampanya.js
          git commit -m "Kampanya oranı siteden güncellendi"
          git push
          echo "degisti=1" >> "$GITHUB_OUTPUT"

      - name: Sayfayı yeniden yayınla
        if: steps.kaydet.outputs.degisti == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
