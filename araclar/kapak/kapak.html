          aylar: ["JANUARI", "FEBRUARI", "MAART", "APRIL", "MEI", "JUNI", "JULI", "AUGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DECEMBER"] }
  };
  var DIL = M[Q.dil] ? Q.dil : "tr", m = M[DIL];
  var HEDEF = Math.round(+Q.hedef) > 0 ? Math.round(+Q.hedef) : 4000000;
  var toplam = Math.round(+Q.toplam), gecerli = isFinite(toplam) && toplam > 0;
  var tm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(Q.tarih || "");
  if (!tm || +tm[2] < 1 || +tm[2] > 12) gecerli = false;

  if (gecerli) {
    var gun = +tm[3]; $("tarih").textContent = "· " + (DIL === "fr" && gun === 1 ? "1ER" : gun) + " " + m.aylar[+tm[2] - 1] + " " + tm[1];
    var s = fmt(toplam), c = $("cnt");
    for (var i = 0; i < s.length; i++) {
      var d = document.createElement("div");
      if (s[i] === ".") d.className = "sp"; else { d.className = "tl"; var sp = document.createElement("span"); sp.textContent = s[i]; d.appendChild(sp); }
      c.appendChild(d);
    }
    var e = document.createElement("div"); e.className = "eu"; e.textContent = "€"; c.appendChild(e);
    /* oran: canlı panodaki gibi aşağı yuvarlanır (binde), çubuk %100'ü geçmez */
    var binde = Math.max(0, Math.min(1000, Math.floor(toplam / HEDEF * 1000 + 1e-9))), oran = Math.max(0, Math.min(1, toplam / HEDEF)), bw = 1088;
    $("b_fl").style.width = (oran * 100) + "%";

    var pc = $("b_pc"), yari = pc.offsetWidth / 2, uc = bw * oran, orta = Math.max(yari - 20, Math.min(bw + 20 - yari, uc));

  function resim(el) { return el.complete && el.naturalWidth > 0 ? Promise.resolve(true) : new Promise(function (r) { el.onload = function () { r(true); }; el.onerror = function () { r(false); }; }); }
